  <div class="w3-container">
    <div class="sub-header">
      <h2 class="heading">Hash function</h2>
    </div>

    <p>Hashing converts your input text or file into a fixed-length digest. This digest is unique to the input data,
      meaning even a single character change results in a completely different hash.</p>

    <label for="hashText">Enter text to hash:</label>
    <textarea id="hashText" rows="4" placeholder="Type something..."></textarea>

    <label for="algorithm">Select algorithm:</label>
    <select id="algorithm">
      <option value="SHA-256">SHA-256</option>
      <option value="SHA-1">SHA-1</option>
      <option value="SHA-512">SHA-512</option>
    </select>

    <button onclick="generateHash()">Generate Hash</button>

    <code id="hashOutput">Result will appear here.</code>
  </div>
  </div>


  <footer style="text-align: center; padding: 1rem 0; font-size: 0.85rem; color: #777;">
    ©
    <script>document.write(new Date().getFullYear())</script> Thuleen.
  </footer>

  <script>
    async function generateHash() {
      const text = document.getElementById('hashText').value;
      const algo = document.getElementById('algorithm').value;

      if (!text.trim()) {
        document.getElementById('hashOutput').textContent = "⚠️ Please enter text.";
        return;
      }

      try {
        let hashBuffer;
        if (algo.startsWith("SHA")) {
          const encoder = new TextEncoder();
          const data = encoder.encode(text);
          hashBuffer = await crypto.subtle.digest(algo, data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          document.getElementById('hashOutput').textContent = hashHex;
        } else if (algo === "MD5") {
          // fallback for MD5 using external script
          document.getElementById('hashOutput').textContent = md5(text);
        }
      } catch (err) {
        document.getElementById('hashOutput').textContent = "❌ Error generating hash.";
        console.error(err);
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"
